[project]
name = "lineage-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "agent-lineage-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "email-validator>=2.3.0",
]

[tool.uv.sources]
agent-lineage-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_service"]
