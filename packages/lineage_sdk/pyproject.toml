[project]
name = "agent-lineage-sdk"
version = "1.0.0"
description = "Capture SDK for agent-lineage: records agent runs so any value can be traced to where it entered."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_sdk"]
